name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE_NAME: ${{ github.repository_owner }}/simple_server
  DOCKER_IMAGE_TAG: ${{ github.ref_name }}
  TARGET_VERSION: "0.0.1"
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: self-hosted
    container:
      image: registry.sh.nextgenwaterprediction.com/infrastructure/rockylinux/rockylinux:9.3
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y python pip
          pip install .[testing]
      - name: Run linting
        run: flake8 . --max-line-length=120

  unit_test:
    runs-on: self-hosted
    container:
      image: registry.sh.nextgenwaterprediction.com/infrastructure/rockylinux/rockylinux:9.3
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y python pip
          pip install .
          pip install .[testing]
      - name: Run tests
        run: |
          coverage run -m pytest --junitxml=test-results.xml
          coverage xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            test-results.xml

  sonarqube:
    runs-on: self-hosted
    needs: unit_test
    container:
      image: registry.sh.nextgenwaterprediction.com/infrastructure/sonar-scanner-cli/sonar-scanner-cli:5.0.1
      options: --entrypoint=""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner -X -Dsonar.verbose=true

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          
  container_scanning:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Container Scanning
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    runs-on: self-hosted
    needs: [build, container_scanning]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
      - name: Tag latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
      - name: Tag version
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TARGET_VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TARGET_VERSION }}
