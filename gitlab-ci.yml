deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to Staging..."
    # Deployment commands here
  rules:
    - changes:
      - '**/*'
    - when: manual


deploy_production:
  stage: deploy
  script:
    - echo "Deploying to Production..."
    # Deployment commands here
  rules:
    - changes:
      - '**/*'
      - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
