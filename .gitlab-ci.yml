stages:
  - sonarqube
  - build
  - test
  - deploy

image: registry.sh.nextgenwaterprediction.com/infrastructure/docker/docker:26.0.2

variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/gitlab_poc
    DOCKER_IMAGE_TAG: $CI_COMMIT_REF_NAME

analyze:sonar:
  stage: sonarqube
  image:
    name: registry.sh.nextgenwaterprediction.com/infrastructure/sonar-scanner-cli/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    # Defines the location of the analysis task cache
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    # Shallow cloning needs to be disabled.
    # See https://docs.sonarqube.org/latest/analysis/gitlab-cicd/.
    GIT_DEPTH: 0
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -X -Dsonar.verbose=true
  rules:
    # SonarQube CommunityEdition only supports analyzing a single branch.
    # So only run on master.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

build:
  stage: build
  script:
    - echo "Logging in to Gitlab Container Registry..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Building test Rocky Linux container... "
    - echo docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG

test:
  stage: test
  needs: 
      - build
  script:
    - echo "Testing..."
    # Test commands here

deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to Staging..."
    # Deployment commands here
  rules:
    - when: manual
    - changes:
      - '**/*'


deploy_production:
  stage: deploy
  script:
    - echo "Deploying to Production..."
    # Deployment commands here
  rules:
    - when: manual
    - if: $CI_COMMIT_BRANCH == 'main'
    - changes:
      - '**/*'
