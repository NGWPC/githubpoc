stages:
  - sonarqube-check
  - build
  - test
  - deploy

image: registry.sh.nextgenwaterprediction.com/infrastructure/docker/docker:26.0.2

variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/gitlab_poc
    DOCKER_IMAGE_TAG: $CI_COMMIT_REF_NAME

before_script:
  - echo "Logging in to Gitlab Container Registry..."
  - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

sonarqube-check:
  stage: sonarqube-check
  script:
    - pwd
    - echo ${CI_PROJECT_DIR}
    - ls -l
    - | 
      docker run --rm 
      -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=infrastructure_gitlabpoc_AY73s78WAAzHqW6WQ7zg" 
      -e GIT_DEPTH=0 
      -e SONAR_HOST_URL=${SONAR_HOST_URL} 
      -e SONAR_TOKEN=${SONAR_TOKEN} 
      -e SONAR_USER_HOME="${CI_PROJECT_DIR}/.sonar" 
      -v "${CI_PROJECT_DIR}:/usr/src" registry.sh.nextgenwaterprediction.com/infrastructure/sonar-scanner-cli/sonar-scanner-cli:5.0.1
  allow_failure: true
  only:
    - main

build:
  stage: build
  script:
    - echo "Building test Rocky Linux container... "
    - echo docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG

test:
  stage: test
  needs: 
      - build
  script:
    - echo "Testing..."
    # Test commands here

deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to Staging..."
    # Deployment commands here
  rules:
    - when: manual
    - changes:
      - '**/*'


deploy_production:
  stage: deploy
  script:
    - echo "Deploying to Production..."
    # Deployment commands here
  rules:
    - when: manual
    - if: $CI_COMMIT_BRANCH == 'main'
    - changes:
      - '**/*'
